# Event model for the SplitIt app - the source of truth.
#
# Render and validate with:
#     .venv/bin/python docs/event-model/generate.py
#
# The .d2 file is generated from this file, named after the chapter; never edit it
# by hand.  Card dimensions and the field-padding width are the generator's
# concern, not the model's: the padding width is computed from the longest line
# in the model.
# Given-when-then specifications live in slice-NN-*.md.
#
# STRUCTURE
#   Every slice owns the elements it introduces.  An element is DECLARED once,
#   in mapping form with a `name`, at its first appearance in slice order; every
#   later appearance is a bare string reference.  So fields are written exactly
#   once, and a misspelled reference is an undeclared name rather than a silent
#   new element.
#
# SLICE TYPES - the four canonical Event Modeling types:
#   State Change  a user action that changes system state, enforcing the business
#                 rules, and recording what happened as events
#   State Read    a screen, report or API response projected from stored events
#   Automation    reacts to a state without human intervention, issuing further
#                 commands or side effects
#   Translation   an integration point where the outside world pushes data in,
#                 mapping foreign data into this domain's language
#   Automation and Translation are recognised but not yet rendered: the happy path
#   needs neither, and their layout is best designed against a real slice.
#
# ARROWS - none are written.
#   Intra-slice arrows are implied by `type`:
#     State Change : screen -> command -> each event, in listed order
#     State Read   : each event in `reads` -> read model -> screen
#   Inter-slice arrows exist only where a read model consumes events emitted in
#   other slices, declared as its `reads` list of event type names.  The
#   generator resolves each name to the nearest occurrence at or before this
#   slice, and draws it dashed when the only occurrence is later.
#
# FIELDS - shape, and where every value comes from (information completeness).
#   A field is `name: Type`, or a mapping when it needs more than a type.
#   Shapes are declared once, like every element.  Sources sit on the field:
#     screen      a type only: what the screen holds, shows or takes in - typed,
#                 picked, or already there (the group viewed, the slot tapped).
#                 No source: values come from the read model, or go to a command
#     command     `source:` by trust -
#                   client  sent by the caller: typed, or held by the screen (default)
#                   system  supplied by the server: signed-in user, clock, new ids
#                   stream  derived by deciding, from the folded stream
#                   lookup  read from outside the stream, e.g. Identity; stale-able,
#                           so it never feeds an event field: it may feed guards, or
#                           propose candidates that deciding confirms against the stream
#                 `feeds:`  [Event.field, ...] - event fields it fills that are
#                           NOT already same-named (same name feeds implicitly)
#     event       a type only.  Where an event's values come from depends on the
#                 slice emitting it, so that lives on that slice's command.
#     read model  `source:` [Event, ...] - the events the field is built from; or
#                 system / lookup - supplied by the server to the read: the
#                 signed-in user, the clock, a document looked up
#   The generator checks BACKWARD only - every value used is available from a
#   step before it: every event field is fed by exactly one command field of the
#   same type; every client command field is a field of its screen; every field of
#   a screen declared by a State Read slice is a field of its read model; every
#   read model field is built from events the read model reads.  Whether a value
#   is used afterwards is not checked.
#   How a client value travels (route, body) is transport, not
#   model: it is recorded in the slice's .md and enforced in code.
#   `draft: true` marks a slice not yet refined: it skips these checks and is
#   labelled "(draft)" on the diagram.  Remove the flag as part of refining.

chapter: Happy path

slices:

  - slice: Create group
    type: State Change
    screen:
      name: New group
      fields:
        groupName: string
        currency: string
        memberName: string
      wireframe:
        - "< Home        New group"
        - "Group name        [........]"
        - "Currency          [ DKK   v ]"
        - "Your name in it   [........]"
        - ""
        - "        [ Create group ]"
    command:
      name: CreateGroup
      fields:
        groupName: { type: string, feeds: [GroupCreated.name] }
        currency: string
        memberName: { type: string, feeds: [MemberAdded.displayName] }
        createdBy:                                         # the signed-in user
          type: UserId
          source: system
          feeds: [MemberAdded.by, MemberClaimed.userId]
        # new id, chosen when the form is shown and carried in it, so a resubmitted
        # form names the group it already created instead of making a second one
        groupId: { type: GroupId, source: system }
        memberId: { type: MemberId, source: system }       # new id; feeds both events by name
    events:
      # three events from one command: a group whose creator is not a member is
      # a meaningless state, so the creator is seated and claimed here
      - name: GroupCreated
        fields:
          groupId: GroupId
          name: string
          currency: string
          createdBy: UserId
      - name: MemberAdded
        fields:
          memberId: MemberId
          displayName: string
          by: UserId
      - name: MemberClaimed
        fields:
          memberId: MemberId
          userId: UserId
    specifications:
      - name: creates the group and its first member
        given: []
        when: { CreateGroup: { groupName: "Lisbon trip", currency: GBP, memberName: Alice, createdBy: alice } }
        then:
          - { GroupCreated: { groupId: g1, name: "Lisbon trip", currency: GBP, createdBy: alice } }
          - { MemberAdded: { memberId: m1, displayName: Alice, by: alice } }
          - { MemberClaimed: { memberId: m1, userId: alice } }

      - name: rejects a blank name
        given: []
        when: { CreateGroup: { groupName: "   ", currency: GBP, memberName: Alice, createdBy: alice } }
        then: [ { rejected: name is required } ]

      - name: rejects an unknown currency
        given: []
        when: { CreateGroup: { groupName: "Lisbon trip", currency: XYZ, memberName: Alice, createdBy: alice } }
        then: [ { rejected: currency must be a known ISO 4217 code } ]

      - name: a group is created exactly once
        given:
          - { GroupCreated: { groupId: g1 } }
        when: { CreateGroup: { groupName: "Lisbon trip", currency: GBP, memberName: Alice, createdBy: alice } }
        then: [ { rejected: group already exists } ]

      - name: rejects a blank display name
        given: []
        when: { CreateGroup: { groupName: "Lisbon trip", currency: GBP, memberName: "   ", createdBy: alice } }
        then: [ { rejected: your name is required } ]

      - name: rejects a group name longer than 100 characters
        given: []
        when: { CreateGroup: { groupName: "<101 characters>", currency: GBP, memberName: Alice, createdBy: alice } }
        then: [ { rejected: name must be at most 100 characters } ]

      - name: rejects a display name longer than 50 characters
        given: []
        when: { CreateGroup: { groupName: "Lisbon trip", currency: GBP, memberName: "<51 characters>", createdBy: alice } }
        then: [ { rejected: your name must be at most 50 characters } ]
    notes:
      - >-
        Scenario 1 seats the creator as an already-claimed member: a group whose creator
        is not a member is a meaningless state, since they could be neither payer nor
        participant.
      - >-
        Scenario 4 is enforced by Marten's stream semantics and optimistic concurrency -
        appending at expected version 0 to an existing stream fails - not by aggregate
        validation.
      - >-
        Scenario 5 was surfaced by implementing the slice: MemberAdded carries a
        displayName, and nothing on the original screen supplied one. The creator's name
        is asked for on the New group screen rather than taken from their account, because
        users have no display name - only an email address - and a member's name is
        per-group anyway ("Dad" in one group, "Tom" in another).
      - >-
        Inputs are trimmed; the currency code is upper-cased before it is checked, so gbp
        is accepted as GBP. The group and member ids are generated by the server.
      - >-
        Scenarios 6 and 7 were added with AddMember, which introduced name limits. Lengths
        are measured after trimming, in visible characters (an emoji counts as one), and
        the limits are inclusive.
      - >-
        Submitting twice creates one group. The group's id is chosen when the form is
        shown and carried in a hidden field; the submit starts the stream under that id.
        A resubmitted form - a double tap, a retry after a dropped connection, the
        browser's back-and-resubmit - names a group that now exists, and goes into that
        group rather than creating a second one. That is scenario 4 doing useful work:
        "group already exists" for that id means the first submit succeeded. Two submits
        racing in the same instant: one saves, the other's save fails on the stream
        collision and is answered 409 (the open "409 retry UX in forms" task, spec §14).
      - >-
        The id comes from the client, so it is not trusted: a malformed one is replaced by
        a fresh id (the form still works, without the double-submit guard). A well-formed
        id of somebody else's group goes to that group's page, which is the same 404 any
        non-member gets - nothing disclosed that guessing the address would not. The
        member id stays the server's, chosen on submit.
      - Antiforgery on the submit (ValidateAntiforgery, spec §3).
      - >-
        No prefill of "your name": users have no display name (scenario 5's note).

  - slice: Add a member
    type: State Change
    screen:
      name: Add member
      fields:
        groupId: GroupId
        displayName: string
        email: string                                      # optional: given, the new member is invited at once
      wireframe:
        - "< Lisbon trip     Add member"
        - "In this group"
        - "  Alice (you)"
        - "  Bob      Invited"
        - "Name              [........]"
        - "Email (optional)  [........]"
        - ""
        - "        [ Add member ]"
    command:
      name: AddMember
      fields:
        displayName: string
        email: string                                      # none: a placeholder, invitable later (InviteMember)
        by: { type: UserId, source: system }               # the signed-in user
        # new id, chosen when the form is shown and carried in it, so a resubmitted
        # form names the member it already added instead of adding a second
        memberId: { type: MemberId, source: system }
        inviteId: { type: InviteId, source: system }       # new id; names the Invite document
        # the clock; the invite's deadline is decided now and recorded: now + 30 days
        now: { type: DateTimeOffset, source: system, feeds: [MemberInvited.expiresAt] }
        # guards for the invite, as InviteMember's (spec §11): may be stale; the claim
        # enforces one user, one slot
        emailHolder: { type: "UserId?", source: lookup }     # Identity: account with this email
        invitedTo: { type: "MemberId[]", source: lookup }    # Invite: slots invited at it
    events:
      # one command, two events: adding with an email is adding and inviting, and a
      # rejected invite adds no one - the form is corrected and sent again
      - MemberAdded
      - name: MemberInvited
        fields:
          memberId: MemberId
          inviteId: InviteId
          expiresAt: DateTimeOffset
          by: UserId
    specifications:
      # no `when`/`then`: the stream every scenario starts from unless it has its own
      # `given`; "..." in a `given` stands for these events
      - name: default stream
        given: [
          { GroupCreated: { groupId: g1, name: "Lisbon trip", currency: GBP, createdBy: alice } },
          { MemberAdded: { memberId: m1, displayName: Alice, by: alice } },
          { MemberClaimed: { memberId: m1, userId: alice } },
        ]

      - name: adds a placeholder member, by name alone
        when: { AddMember: { displayName: Bob, by: alice } }
        then:
          - { MemberAdded: { memberId: m2, displayName: Bob, by: alice } }

      - name: any member may add, and is recorded as the actor
        given:
          - "..."
          - { MemberAdded: { memberId: m2, displayName: Bob, by: alice } }
          - { MemberClaimed: { memberId: m2, userId: bob } }
        when: { AddMember: { displayName: Carol, by: bob } }
        then:
          - { MemberAdded: { memberId: m3, displayName: Carol, by: bob } }

      - name: the group must exist
        given: []
        when: { AddMember: { displayName: Bob, by: alice } }
        then: [ { rejected: group not found } ]

      - name: only members of the group may add
        when: { AddMember: { displayName: Bob, by: mallory } }
        then: [ { rejected: group not found } ]

      - name: an unclaimed placeholder confers no membership
        given:
          - "..."
          - { MemberAdded: { memberId: m2, displayName: Bob, by: alice } }
        when: { AddMember: { displayName: Carol, by: bob } }
        then: [ { rejected: group not found } ]

      - name: rejects a blank name
        when: { AddMember: { displayName: "   ", by: alice } }
        then: [ { rejected: name is required } ]

      - name: rejects a name already used in the group
        when: { AddMember: { displayName: " alice ", by: alice } }
        then: [ { rejected: a member with that name already exists } ]

      - name: rejects a name longer than 50 characters
        when: { AddMember: { displayName: "<51 characters>", by: alice } }
        then: [ { rejected: name must be at most 50 characters } ]

      - name: trims the name
        when: { AddMember: { displayName: "  Bob ", by: alice } }
        then:
          - { MemberAdded: { memberId: m2, displayName: Bob, by: alice } }

      - name: with an email, adds and invites in one
        when: { AddMember: { displayName: Bob, email: "bob@example.com", by: alice } }
        then:
          - { MemberAdded: { memberId: m2, displayName: Bob, by: alice } }
          - { MemberInvited: { memberId: m2, inviteId: i1, expiresAt: "t0+30d", by: alice } }

      - name: a blank email is no email
        when: { AddMember: { displayName: Bob, email: "   ", by: alice } }
        then:
          - { MemberAdded: { memberId: m2, displayName: Bob, by: alice } }

      - name: an email that is not plausibly one adds no one
        when: { AddMember: { displayName: Bob, email: bob, by: alice } }
        then: [ { rejected: email is not a valid address } ]

      - name: the address of a user already in the group adds no one
        with: { emailHolder: { "alice@example.com": alice } }
        when: { AddMember: { displayName: Bob, email: "alice@example.com", by: alice } }
        then: [ { rejected: "alice@example.com has already joined as Alice" } ]

      - name: an address with an open invite on another slot adds no one
        given:
          - "..."
          - { MemberAdded: { memberId: m2, displayName: Bobby, by: alice } }
          - { MemberInvited: { memberId: m2, inviteId: i0, by: alice } }
        with: { invitedTo: { "bob@example.com": [ m2 ] } }
        when: { AddMember: { displayName: Bob, email: "BOB@example.com", by: alice } }
        then: [ { rejected: that email is already invited as Bobby } ]

      - name: an invite to a slot since claimed no longer holds its address
        given:
          - "..."
          - { MemberAdded: { memberId: m2, displayName: Bobby, by: alice } }
          - { MemberInvited: { memberId: m2, inviteId: i0, by: alice } }
          - { MemberClaimed: { memberId: m2, userId: bob } }
        with:
          invitedTo: { "bob@example.com": [ m2 ] }
          emailHolder: { "bob@example.com": none }
        when: { AddMember: { displayName: Bob, email: "bob@example.com", by: alice } }
        then:
          - { MemberAdded: { memberId: m3, displayName: Bob, by: alice } }
          - { MemberInvited: { memberId: m3, inviteId: i1, expiresAt: "t0+30d", by: alice } }

      - name: the name is checked before the email
        when: { AddMember: { displayName: "", email: bob, by: alice } }
        then: [ { rejected: name is required } ]

      - name: a member id already added is not added twice
        given:
          - "..."
          - { MemberAdded: { memberId: m2, displayName: Bob, by: alice } }
        when: { AddMember: { memberId: m2, displayName: Bob, by: alice } }
        then: [ { rejected: member already added, kind: already recorded } ]

      - name: an archived group takes no new members
        given:
          - "..."
          - { GroupArchived: { by: alice } }
        when: { AddMember: { displayName: Dave, by: alice } }
        then: [ { rejected: group is archived } ]
    notes:
      - >-
        Scenarios run against group g1's stream. The group only selects the stream, so it
        is not a command field (spec §13).
      - >-
        i0, i1 are invite ids (i1 the new invite's, chosen by the endpoint); every command
        is issued at t0. Lookups are written `with`, as in InviteMember: they come from
        outside the stream and feed guards, not invariants. m2 is the id the endpoint chose
        for the new member; the member-id scenario passes the same one twice.
      - >-
        The scenarios "the group must exist", "only members of the group may add" and "an
        unclaimed placeholder confers no membership" give the same answer on purpose. A
        non-member must not be able to tell a group that exists from one that does not, so
        "no such group" and "not a member" are indistinguishable - over HTTP both are 404,
        as is a malformed group id. Membership is checked before any input, so a non-member
        learns nothing from validation messages either.
      - >-
        Being added is not being a member. A placeholder is a slot in the ledger;
        membership - the right to change the group - comes from holding a claim on a slot.
      - >-
        Names are trimmed, compared case-insensitively for duplicates, and limited to 50
        visible characters after trimming. Rejection wording is per context: "name" here,
        "your name" in CreateGroup.
      - by is the signed-in user, never a member slot (spec §12).
      - >-
        Order of checks: membership, then archived, then the id (already added), then the
        name, then - only when an email is given - the email and its guards. A non-member
        gets `group not found` whatever else is wrong.
      - >-
        Why a rejected invite adds no one. The alternative, adding the placeholder and
        reporting that the invite failed, leaves a member the form cannot be corrected
        against: sending it again is refused as a duplicate name. Nothing is lost by
        refusing both - the form comes back as typed - and the invite can always be sent
        later from the list.
      - >-
        The invite rules are InviteMember's, not a copy of them: the email check and the
        two guards are one pure function in Shared/, called by both slices, so the rules
        cannot drift apart. The 30-day lifetime moves there with them. InviteMember's
        scenarios stand unchanged; the invite scenarios above are the same rules reached
        from here. The lookups are the same too: Identity for emailHolder, Invite documents
        for invitedTo, both only when an email is given.
      - >-
        State grows to what the screen and the guards need: each slot's name, whether it is
        claimed and its newest invite's deadline; which slot each user holds; the group's
        name (the Back link, the invite email). Slots are no longer just names' keys, so
        NameKeys is derived from them.
      - >-
        Submitting twice adds one member. As Add expense: the new member's id is chosen
        when the form is shown and carried in a hidden field, and deciding knows the slots
        it has seen (the member-id scenario), so a double tap, a retry or the back button
        goes to the screen as if it had added them. The id comes from the client, so it is
        not trusted: a malformed one is replaced by a fresh id. The invite's id is the
        server's alone.
      - >-
        With an email, the endpoint also stores the slot's Invite document - in the same
        transaction as the events, its id the event's inviteId - and sends the invite email
        after the commit, and only if the save succeeded; a send failure is logged (ids,
        not the address) and the invite stands. The email names the group, the inviter (the
        actor's slot) and the new member, and links to the app - no secret
        (slice-03-invite-member.md).
      - Antiforgery on the submit (ValidateAntiforgery, spec §3).
      - Concurrency - a concurrent save answers 409, as Add expense.
      - >-
        Concurrency - two phones adding at once: both decide against the same stream
        version, the first save wins, the second gets 409 Conflict and the client retries,
        at which point the rules run against the new state, so a duplicate name is then
        rejected properly. Server-side retry was considered and deferred. On the screen the
        409 is the bare response, as Add expense (the open "409 retry UX" task, spec §14).
      - Deferred - a released claim ends membership (R2), with MemberClaimReleased.
      - Deferred - a removed member's name may be reused (R5), with MemberRemoved.
      - >-
        Deferred - a renamed member's old name is free and new name taken (R5), with
        MemberRenamed.

  - slice: Invite a member
    type: State Change
    screen:
      name: Invite member
      fields:
        groupId: GroupId
        memberId: MemberId
        email: string
    command:
      name: InviteMember
      fields:
        memberId: MemberId
        # no email in the ledger: it goes to the erasable Invite document, and the email
        email: string
        # names the Invite document that binds this slot to the address
        inviteId: { type: InviteId, source: system }       # new id
        # the clock; the invite's deadline is decided now and recorded: now + 30 days
        now: { type: DateTimeOffset, source: system, feeds: [MemberInvited.expiresAt] }
        by: { type: UserId, source: system }               # the signed-in user
        # guards (spec §11): may be stale; the claim enforces one user, one slot
        emailHolder: { type: "UserId?", source: lookup }     # Identity: account with this email
        invitedTo: { type: "MemberId[]", source: lookup }    # Invite: slots invited at it
    events: [MemberInvited]

  - slice: View homepage
    type: State Read
    screen:
      name: Home
      fields:
        invites: "PendingInvite[]"
        groups: "GroupSummary[]"
        archived: "GroupSummary[]"
      wireframe:
        - "Alice invited you to"
        - "Lisbon trip as Bob  [Join]"
        - ""
        - "Your groups"
        - "  Lisbon trip"
        - "  Porto"
        - "  Archived (1) >"
        - "[New group]"
    readModel:
      # two parts, each kept the way its data needs (spec §11):
      # groups - a stored, asynchronous projection (UserGroups), keyed by user and
      #   folded across every group's events: the list cannot be computed per request
      # invites - live: each invited group's stream is folded per request. An invite
      #   shows only while it is its slot's current one, unclaimed and unexpired, in
      #   a group the user is not already in.
      name: HomepageReadModel
      fields:
        userId: { type: UserId, source: system }           # the signed-in user
        # Invite documents addressed to the user's (verified) account email
        invitedAs: { type: "InviteId[]", source: lookup }
        now: { type: DateTimeOffset, source: system }      # live while now < expiresAt
        # each with its group id, which "Join" sends; soonest deadline first
        invites: { type: "PendingInvite[]", source: [GroupCreated, GroupRenamed, GroupArchived, MemberAdded, MemberInvited, MemberClaimed] }
        # the groups the user holds a slot in, by current name; an archived one is kept apart
        groups: { type: "GroupSummary[]", source: [GroupCreated, GroupRenamed, MemberClaimed] }
        archived: { type: "GroupSummary[]", source: [GroupCreated, GroupRenamed, GroupArchived, MemberClaimed] }
      reads:
        - GroupCreated
        - GroupRenamed
        - GroupArchived
        - MemberAdded
        - MemberInvited
        - MemberClaimed

  - slice: Accept invite
    type: State Change
    screen: Home
    command:
      name: AcceptInvite
      fields:
        now: { type: DateTimeOffset, source: system }      # the clock: now < expiresAt
        userId: { type: UserId, source: system }           # the signed-in user, claiming
        # Invite documents in this group addressed to the user's account email: they
        # propose; the stream decides which, if any, is a slot's current open invite
        invitedAs: { type: "InviteId[]", source: lookup }
        # the slot whose current, unexpired invite is one of those - found by deciding
        memberId: { type: MemberId, source: stream }
    events: [MemberClaimed]

  - slice: Record an expense
    type: State Change
    screen:
      name: Add expense
      fields:
        groupId: GroupId
        description: string
        amountMinor: long                                  # typed in the currency's units ("120.50"); the endpoint converts
        payerMemberId: MemberId
        # one of: equal (participants) | shares (a share each) | exact (an amount each)
        # the form offers all three, as radio buttons; the mode's fields are shown by CSS
        split: ExpenseSplit
        paidOn: DateOnly
      wireframe:
        - "< Lisbon trip     Add expense"
        - "What for          [ Dinner   ]"
        - "Amount (GBP £)    [ 120.00   ]"
        - "Paid by           [ Alice v  ]"
        - "Split  (o) Equally ( ) Shares ( ) Exact"
        - "Shared between"
        - "  [x] Alice  [x] Bob  [ ] Carol"
        - "Date              [ 2 Oct    ]"
        - ""
        - "         [ Add expense ]"
    command:
      name: RecordExpense
      fields:
        # new id, chosen when the form is shown and carried in it, so a resubmitted
        # form names the expense it already recorded instead of recording a second
        expenseId: { type: ExpenseId, source: system }
        description: string
        amountMinor: long
        payerMemberId: MemberId
        split: ExpenseSplit                                # the inputs, as entered
        paidOn: DateOnly
        now: { type: DateTimeOffset, source: system }      # the clock: paidOn is not in the future
        by: { type: UserId, source: system }               # the signed-in user
        # the per-person amounts, computed by deciding (spec §6): the rounding's
        # leftovers go payer first, then in member-added order - read from the stream
        splits: { type: "Split[]", source: stream }
    events:
      - name: ExpenseRecorded
        fields:
          expenseId: ExpenseId
          description: string
          amountMinor: long
          payerMemberId: MemberId
          split: ExpenseSplit
          splits: "Split[]"
          paidOn: DateOnly
          by: UserId

  - slice: View group
    type: State Read
    screen:
      name: Group
      fields:
        groupId: GroupId
        groupName: string
        currency: string
        you: MemberId                                      # what you paid sits on the left
        archived: bool                                     # a banner, and no actions
        balance: long                                      # your standing, beside Settle up
        history: "ActivityEntry[]"
      wireframe:
        - "< Home       Lisbon trip"
        - "You owe £70.00 [Settle up]"
        - "Dinner £90.00"
        - "  You paid"
        - "             Taxi £140.00"
        - "                Bob paid"
        - "[Add expense]  [Balances]"
    readModel:
      # stored, inline: projected in the transaction that appends the events, so an
      # expense appears, and your standing moves, the moment it is saved (spec §11)
      name: GroupActivityReadModel
      fields:
        userId: { type: UserId, source: system }           # the signed-in user: members only
        groupId: { type: GroupId, source: [GroupCreated] }
        groupName: { type: string, source: [GroupCreated, GroupRenamed] }
        currency: { type: string, source: [GroupCreated] }
        you: { type: MemberId, source: [MemberClaimed] }   # the caller's own slot
        archived: { type: bool, source: [GroupArchived] }  # read-only: no actions are offered
        # the caller's balance (spec §9)
        balance: { type: long, source: [ExpenseRecorded, ExpenseEdited, ExpenseRemoved, SettlementRecorded] }
        # the money: expenses and settlements in one list, each marked by kind and
        # named, newest first; an expense with its split as entered and its amounts
        history: { type: "ActivityEntry[]", source: [MemberAdded, ExpenseRecorded, ExpenseEdited, ExpenseRemoved, SettlementRecorded] }
      reads:
        - GroupCreated
        - MemberAdded
        - MemberClaimed
        - ExpenseRecorded
        - ExpenseEdited
        - ExpenseRemoved
        - SettlementRecorded   # emitted in Record settlement: drawn dashed
        - GroupRenamed         # emitted in Rename group: drawn dashed
        - GroupArchived        # emitted in Archive group: drawn dashed

  - slice: View balances
    type: State Read
    screen:
      name: Balances
      fields:
        groupId: GroupId
        groupName: string
        currency: string
        you: MemberId
        members: "MemberBalance[]"
      wireframe:
        - "< Lisbon trip   Balances"
        - "Alice (you)  is owed £60.00"
        - "Bob                owes £30.00"
        - "Carol (invited)  owes £30.00"
        - ""
        - "              [Settle up]"
    readModel:
      # live: the group stream folded per request, nothing stored (spec §11).
      # Balances follow spec §9 and always sum to zero.
      name: GroupBalancesReadModel
      fields:
        userId: { type: UserId, source: system }           # the signed-in user: members only
        now: { type: DateTimeOffset, source: system }      # an invite is open until its deadline
        groupId: { type: GroupId, source: [GroupCreated] }
        groupName: { type: string, source: [GroupCreated, GroupRenamed] }
        currency: { type: string, source: [GroupCreated] }
        you: { type: MemberId, source: [MemberClaimed] }   # the caller's own slot
        # each slot with its name, status (joined, invited, placeholder) and balance
        members: { type: "MemberBalance[]", source: [MemberAdded, MemberInvited, MemberClaimed, ExpenseRecorded, ExpenseEdited, ExpenseRemoved, SettlementRecorded] }
      reads:
        - GroupCreated
        - GroupRenamed
        - MemberAdded
        - MemberInvited
        - MemberClaimed
        - ExpenseRecorded
        - ExpenseEdited
        - ExpenseRemoved
        - SettlementRecorded   # emitted in Record settlement: drawn dashed

  - slice: Record settlement
    type: State Change
    screen:
      name: Settle up
      fields:
        groupId: GroupId
        fromMemberId: MemberId                             # who paid
        toMemberId: MemberId                               # who received
        amountMinor: long                                  # in the group currency's minor unit
        paidOn: DateOnly
      wireframe:
        - "Bob pays Alice  30.00 [Paid]"
        - ""
        - "or record any payment:"
        - "[ Bob v ] -> [ Alice v ]"
        - "[ 30.00 ]  on [ 2 Oct ]"
        - "             [ Record ]"
    command:
      name: RecordSettlement
      fields:
        settlementId: { type: SettlementId, source: system } # new id
        fromMemberId: MemberId
        toMemberId: MemberId
        amountMinor: long
        paidOn: DateOnly
        now: { type: DateTimeOffset, source: system }      # the clock: paidOn is not in the future
        by: { type: UserId, source: system }               # the signed-in user: any member
    events:
      - name: SettlementRecorded
        fields:
          settlementId: SettlementId
          fromMemberId: MemberId
          toMemberId: MemberId
          amountMinor: long
          paidOn: DateOnly
          by: UserId

  - slice: View settlement plan
    type: State Read
    screen: Settle up
    readModel:
      # computed per request from a live fold of the group stream; never stored and
      # never an event (spec §10, §11). A pure function of the balances, with shared
      # history only breaking ties.
      name: SettlementPlanReadModel
      fields:
        userId: { type: UserId, source: system }           # the signed-in user: members only
        currency: { type: string, source: [GroupCreated] }
        you: { type: MemberId, source: [MemberClaimed] }   # the caller's own slot
        # who pays whom, with names, ordered by payer then recipient (member-added)
        transfers: { type: "Transfer[]", source: [MemberAdded, ExpenseRecorded, ExpenseEdited, ExpenseRemoved, SettlementRecorded] }
      reads:
        - GroupCreated
        - MemberAdded
        - MemberClaimed
        - ExpenseRecorded
        - ExpenseEdited
        - ExpenseRemoved
        - SettlementRecorded

  - slice: Remove expense
    type: State Change
    screen:
      name: Remove expense
      fields:
        groupId: GroupId
        expenseId: ExpenseId
      wireframe:
        - "< Lisbon trip     Remove expense"
        - "Dinner            £90.00"
        - "Alice paid · 2 Oct"
        - ""
        - "Balances will update."
        - "       [ Remove expense ]"
    command:
      name: RemoveExpense
      fields:
        expenseId: ExpenseId
        by: { type: UserId, source: system }               # the signed-in user: any member
    events:
      - name: ExpenseRemoved
        fields:
          expenseId: ExpenseId
          by: UserId

  - slice: Edit expense
    type: State Change
    screen:
      name: Edit expense
      fields:
        groupId: GroupId
        expenseId: ExpenseId
        description: string
        amountMinor: long                                  # typed in the currency's units, as in Add expense
        payerMemberId: MemberId
        split: ExpenseSplit
        paidOn: DateOnly
      wireframe:
        - "< Lisbon trip     Edit expense"
        - "What for          [ Dinner   ]"
        - "Amount (GBP £)    [ 120.00   ]"
        - "Paid by           [ Alice v  ]"
        - "Split  (o) Equally ( ) Shares ( ) Exact"
        - "Shared between"
        - "  [x] Alice  [x] Bob  [ ] Carol"
        - "Date              [ 2 Oct    ]"
        - ""
        - "         [ Save changes ]"
    command:
      name: EditExpense
      fields:
        expenseId: ExpenseId
        description: string
        amountMinor: long
        payerMemberId: MemberId
        split: ExpenseSplit                                # the inputs, as entered
        paidOn: DateOnly
        now: { type: DateTimeOffset, source: system }      # the clock: paidOn is not in the future
        by: { type: UserId, source: system }               # the signed-in user: any member
        # recomputed on every edit, as in Record expense (spec §6)
        splits: { type: "Split[]", source: stream }
    events:
      - name: ExpenseEdited
        fields:
          expenseId: ExpenseId
          description: string
          amountMinor: long
          payerMemberId: MemberId
          split: ExpenseSplit
          splits: "Split[]"
          paidOn: DateOnly
          by: UserId

  - slice: View expense
    type: State Read
    screen:
      name: Expense
      fields:
        groupId: GroupId
        expenseId: ExpenseId
        archived: bool                                     # no Edit, no Remove
      # a bottom sheet over the group page; its own page without script
      wireframe:
        - "Dinner            £90.00  [x]"
        - "You paid · 1 Oct 2026"
        - "Shared equally"
        - "  Alice (you)    £30.00"
        - "  Bob            £30.00"
        - "  Carol          £30.00"
        - ""
        - "           [pencil] [bin]"
    readModel:
      # live: the group stream folded per request, nothing stored (spec §11)
      name: ExpenseReadModel
      fields:
        userId: { type: UserId, source: system }           # the signed-in user: members only
        groupId: { type: GroupId, source: [GroupCreated] }
        expenseId: { type: ExpenseId, source: [ExpenseRecorded] }
        currency: { type: string, source: [GroupCreated] }
        you: { type: MemberId, source: [MemberClaimed] }   # the caller's own slot
        archived: { type: bool, source: [GroupArchived] }
        # the expense as it stands: recorded, with every edit since folded in
        expense: { type: Expense, source: [ExpenseRecorded, ExpenseEdited] }
        # who shares it, with names, and what each owes: the amounts recorded, in
        # member-added order, with the weight where the split is by shares
        shares: { type: "ExpenseShare[]", source: [MemberAdded, ExpenseRecorded, ExpenseEdited] }
      reads:
        - GroupCreated
        - MemberAdded
        - MemberClaimed
        - ExpenseRecorded
        - ExpenseEdited
        - ExpenseRemoved
        - GroupArchived        # emitted in Archive group: drawn dashed

  - slice: Rename group
    type: State Change
    screen:
      name: Rename group
      fields:
        groupId: GroupId
        name: string
      wireframe:
        - "< Lisbon trip     Rename group"
        - "Group name        [ Lisbon trip ]"
        - ""
        - "         [ Save ]"
    command:
      name: RenameGroup
      fields:
        name: string
        by: { type: UserId, source: system }               # the signed-in user: any member
    events:
      - name: GroupRenamed
        fields:
          name: string
          by: UserId

  - slice: Archive group
    type: State Change
    screen:
      name: Archive group
      fields:
        groupId: GroupId
      wireframe:
        - "< Lisbon trip     Archive group"
        - "Nobody will be able to add"
        - "expenses or change the group."
        - "This can't be undone yet."
        - ""
        - "Not everyone is settled up:"
        - "Bob owes £30.00. Archive anyway?"
        - "       [ Archive group ]"
    command:
      name: ArchiveGroup
      fields:
        by: { type: UserId, source: system }               # the signed-in user: any member
    events:
      - name: GroupArchived
        fields:
          by: UserId

  - slice: Change default split
    type: State Change
    screen:
      name: Default split
      fields:
        groupId: GroupId
        mode: string                                       # equal | shares; never exact
        shares: "MemberShares[]"                           # 0 = left out; not listed = 1
      wireframe:
        - "< Lisbon trip     Default split"
        - "Split  (o) Equally ( ) Shares"
        - "Shared between"
        - "  [x] Alice  [x] Bob  [ ] Dave"
        - ""
        - "         [ Save ]"
    command:
      name: ChangeDefaultSplit
      fields:
        mode: string
        shares: "MemberShares[]"
        by: { type: UserId, source: system }               # the signed-in user: any member
    events:
      - name: GroupDefaultSplitChanged
        fields:
          mode: string
          shares: "MemberShares[]"                         # normalised: only the shares that are not 1
          by: UserId

